<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="// spin until free. while (debt > 0) ship();">
  <title>// spin until free: while (debt &gt; 0) ship();</title>
  <rect width="800" height="150" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="149" rx="10" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="5" fill="#ff7b72"/>
  <circle cx="42" cy="22" r="5" fill="#ffa657"/>
  <circle cx="60" cy="22" r="5" fill="#3fb950"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" xml:space="preserve">
    <text x="32" y="75" fill="#6e7681">// spin until free</text>
    <text x="32" y="115"><tspan fill="#ff7b72">while</tspan><tspan fill="#c9d1d9"> (</tspan><tspan fill="#ffa657">debt</tspan><tspan fill="#c9d1d9"> &gt; </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9">) </tspan><tspan fill="#d2a8ff">ship</tspan><tspan fill="#c9d1d9">();</tspan></text>
    <rect x="428" y="94" width="14" height="26" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
